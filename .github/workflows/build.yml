
name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          set -eo pipefail
          Z="$(ls *.zip | sort -V | tail -1)"
          echo "Using $Z"
          unzip -q "$Z" -d unz
          P=$(dirname "$(find unz -name pubspec.yaml | head -1)")
          mkdir app
          cp -r "$P"/. app/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare Android project
        working-directory: app
        run: |
          set -eo pipefail
          cp android/app/src/main/AndroidManifest.xml /tmp/m.xml
          flutter create . --platforms=android --project-name territory_app --org com.territory
          cp /tmp/m.xml android/app/src/main/AndroidManifest.xml
          rm -f test/widget_test.dart
          flutter pub get

      - name: Test
        working-directory: app
        continue-on-error: true
        run: flutter test test/hex_grid_test.dart

      - name: Build APK
        working-directory: app
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      - uses: actions/upload-artifact@v4
        with:
          name: territory-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: app/build.log
          if-no-files-found: ignore
